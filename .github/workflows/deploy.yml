name: テストして GitHub Pages に公開

# プルリクエストでは テストだけ、main に マージされたら 公開する
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: ユニットテスト
        run: npm test
      - name: Playwright (Chromium) のインストール
        run: npx playwright install --with-deps chromium
      - name: E2E テスト (iPad サイズ)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    # main への push (プルリクエストの マージ) だけ 公開する
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    outputs:
      mode: ${{ steps.pages.outputs.mode }}
    steps:
      - id: pages
        name: GitHub Pages の公開方法を確認
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null || echo "none")
          echo "mode=${mode:-none}" >> "$GITHUB_OUTPUT"
          echo "GitHub Pages: ${mode:-none}"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: gh-pages ブランチへ公開
        # Settings → Pages の Source が「Deploy from a branch (gh-pages)」のとき
        if: steps.pages.outputs.mode != 'workflow'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "公開: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          if [ "${{ steps.pages.outputs.mode }}" = "none" ]; then
            echo "::notice::gh-pages ブランチを更新しました。Settings → Pages → Build and deployment で Source を「Deploy from a branch」、Branch を「gh-pages / (root)」にすると公開されます。"
          fi
      - if: steps.pages.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Settings → Pages の Source が「GitHub Actions」のとき
  deploy-actions:
    needs: deploy
    if: needs.deploy.outputs.mode == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
