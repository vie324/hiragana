name: テストして GitHub Pages に公開

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: ユニットテスト
        run: npm test
      - name: Playwright (Chromium) のインストール
        run: npx playwright install --with-deps chromium
      - name: E2E テスト (iPad サイズ)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    # リポジトリの デフォルトブランチ への push だけ 公開する
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: pages
        name: GitHub Pages が有効か確認
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages が未設定のため公開をスキップしました。Settings → Pages → Build and deployment の Source を「GitHub Actions」にすると、次の push から自動で公開されます。"
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.pages.outputs.enabled == 'true'
        run: npm ci
      - if: steps.pages.outputs.enabled == 'true'
        run: npx vite build
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
